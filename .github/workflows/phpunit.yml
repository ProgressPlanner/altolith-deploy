name: PHPUnit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 1
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysqli, pdo_mysql
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup WordPress test environment
        env:
          WP_VERSION: latest
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: |
          # Install WordPress test suite with PHP-version-specific database name
          bash bin/install-wp-tests.sh wordpress_test_${{ matrix.php }} root root 127.0.0.1:3306 $WP_VERSION

      - name: Run PHPUnit tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test

      - name: Run Unit tests only
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:unit

      - name: Run Integration tests only
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration
